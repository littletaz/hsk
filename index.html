<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字墙 · HSK Wall</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="wall"></canvas>

  <script src="data/hsk1.js"></script>
  <script src="src/card.js"></script>
  <script src="src/dev-tools.js"></script>
  <script src="src/wall.js"></script>
  <script>
    async function boot() {
      await Promise.all([
        document.fonts.load('400 53px "Huninn"'),
        document.fonts.load('600 15px "Quicksand"'),
        document.fonts.load('400 53px "Noto Sans SC"'),
        loadCardMask('assets/card-mask.png')
      ]);

      const canvas = document.getElementById('wall');
      createWall(canvas, HSK1);
    }

    boot();
  </script>
</body>
</html>
