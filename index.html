<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字墙 · HSK Wall</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="wall"></canvas>
  <div id="filter-bar"></div>

  <script src="data/hsk1.js"></script>
  <script src="data/hsk2.js"></script>

  <script src="src/card.js"></script>
  <script src="src/dev-tools.js"></script>
  <script src="src/wall.js"></script>
  <script>
    async function boot() {
      await Promise.all([
        document.fonts.load('400 53px "Huninn"'),
        document.fonts.load('600 15px "Quicksand"'),
        document.fonts.load('400 53px "Noto Sans SC"'),
        loadCardMask('assets/card-mask.png')
      ]);

      const canvas = document.getElementById('wall');
      const ALL_WORDS = [...HSK1, ...HSK2];
      const wall = createWall(canvas, ALL_WORDS);
      setupFilterBar(ALL_WORDS, wall);
    }

    const CATEGORY_LABELS = {
      num: 'Numbers', pron: 'Pronouns', people: 'People', time: 'Time',
      place: 'Places', food: 'Food', obj: 'Objects', animal: 'Animals',
      verb: 'Verbs', adj: 'Adjectives', weather: 'Weather', greet: 'Greetings',
      func: 'Function Words', school: 'School', work: 'Work', health: 'Health'
    };

    function setupFilterBar(allWords, wall) {
      const categories = [...new Set(allWords.map(w => w.cat))].sort();
      const active = new Set();
      const bar = document.getElementById('filter-bar');

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-chip';
        btn.type = 'button';
        btn.textContent = CATEGORY_LABELS[cat] || cat;
        btn.addEventListener('click', () => {
          if (active.has(cat)) {
            active.delete(cat);
            btn.classList.remove('active');
          } else {
            active.add(cat);
            btn.classList.add('active');
          }
          const filtered = active.size === 0
            ? allWords
            : allWords.filter(w => active.has(w.cat));
          wall.setActiveWords(filtered);
        });
        bar.appendChild(btn);
      });
    }

    boot();
  </script>
</body>
</html>
